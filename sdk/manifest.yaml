# Flamehaven Document SDK -- Component Manifest (agent-decidable)
# Query index for reusable HTML design functions / modals used in CAS reports
# and Flamehaven document artifacts.
#
# RULE (DI-SDK-001): When a document needs a visual function (chart, modal,
# badge, timeline, comparison table, collapsible, etc.), query THIS manifest
# FIRST. Only search externally if no entry fits. See sdk/README.md.
#
# RULE (DI-SDK-002): Component selection is AGENT-JUDGED, not hardcoded. The
# agent reads each entry's `when` trigger + `interaction` class and binds the
# section to the best-fit modal per sdk/SELECTION_PROTOCOL.md.
#
# These are common HTML design techniques, not protected expression. CAS
# components are RE-WRITTEN from these patterns, not copied -- so deliverables
# carry no attribution burden. The only attribution is the vendored verbatim
# copy under vendor/, which keeps its own LICENSE (Apache-2.0). See NOTICE.md.

sdk_version: "0.2.0"
created: "2026-06-21"

# ---------------------------------------------------------------------------
# Interaction policy (functional yes / decorative no)
#   functional : hover-preview, collapsible, copy, click-expand, tabs,
#                keyboard-nav, jump-links -- ALLOWED, encoded per component
#   decorative : parallax, particles, entrance/scroll motion, decor sliders
#                -- BANNED (violates "show, do not persuade")
# ---------------------------------------------------------------------------
interaction_policy:
  functional: allowed
  decorative: banned

license_policy:
  vendored_verbatim: "keep upstream LICENSE in vendor/<source>/ + one NOTICE.md pointer"
  our_components: "pattern re-implemented = our own expression = no attribution owed"
  client_deliverables: "built from our_components = zero license burden"

# ---------------------------------------------------------------------------
# Internal components (Flamehaven-owned, license 100% ours)
# Source: hsp01-governance-artifact dossier-site. The proven CAS visual vocab.
# Fields: function (what it is) | when (agent trigger) | interaction
# ---------------------------------------------------------------------------
internal:
  - id: badge-verdict
    function: "status declaration block (PASS/WARN/FAIL/NOTE color-coded)"
    when: "stating a verdict on a claim or module; color + intensity follow evidence level"
    interaction: none
  - id: chip
    function: "inline pill tag"
    when: "tagging metadata inline (evidence level, failure type, severity)"
    interaction: none
  - id: metric
    function: "big-number + label tile"
    when: "surfacing a top-line number (score, percent, count)"
    interaction: none
  - id: card-panel
    function: "container surface with header/kicker"
    when: "wrapping any report section"
    interaction: none
  - id: list-card
    function: "titled bullet list block"
    when: "presenting parallel lists (what-it-proves / why-it-matters)"
    interaction: none
  - id: code-frame
    function: "evidence excerpt with copy-to-clipboard button"
    when: "showing a code or data excerpt as proof"
    interaction: "functional (copy button)"
  - id: callout
    function: "provenance / scope note with accent border"
    when: "stating where evidence came from, or a scope caveat"
    interaction: none
  - id: evidence-table
    function: "inspectability ladder table"
    when: "listing what a reader can independently inspect"
    interaction: none
  - id: preview-dock
    function: "hover-preview fixed panel + reader-routing index"
    when: "a multi-page report needs preview-on-hover navigation"
    interaction: "functional (hover / focus)"

# ---------------------------------------------------------------------------
# Vendored reference library (Apache-2.0, ThariqS/html-effectiveness)
# Full verbatim copies under vendor/html-effectiveness/. Use as PATTERN source:
# read the file, re-implement the technique into a CAS component.
# `when` = agent trigger for placement. `avoid` flags out-of-scope/decorative.
# ---------------------------------------------------------------------------
vendor_html_effectiveness:
  source: "https://github.com/ThariqS/html-effectiveness"
  license: "Apache-2.0"
  path: "vendor/html-effectiveness/"
  demos:
    - id: exploration-code-approaches
      file: "01-exploration-code-approaches.html"
      function: "side-by-side comparison of N approaches with inline trade-offs"
      when: "presenting >=2 remediation/design options with trade-offs"
      interaction: none
    - id: exploration-visual-designs
      file: "02-exploration-visual-designs.html"
      function: "live-rendered layout/palette options"
      when: "offering theme/layout options for the reader to react to"
      interaction: none
    - id: code-review-pr
      file: "03-code-review-pr.html"
      function: "diff with margin notes, severity tags, jump links"
      when: "Case#1 findings on a diff (sec 2, 3.2) -- top match for verdict+severity"
      interaction: "functional (jump links)"
    - id: code-understanding
      file: "04-code-understanding.html"
      function: "package as boxes+arrows, hot path highlighted, entry points"
      when: "explaining unfamiliar architecture (Case#1/#3 sec 3.1, 3.3)"
      interaction: none
    - id: design-system
      file: "05-design-system.html"
      function: "color/type/spacing tokens rendered as copyable swatches"
      when: "documenting the CAS design tokens themselves"
      interaction: "functional (copy swatch)"
    - id: component-variants
      file: "06-component-variants.html"
      function: "every size/state/intent of one component on one sheet"
      when: "rendering the SDK gallery itself"
      interaction: none
    - id: prototype-animation
      file: "07-prototype-animation.html"
      function: "isolated transition with duration/easing sliders"
      when: "reference only"
      interaction: "decorative"
      avoid: "decorative -- do not place in a CAS deliverable"
    - id: prototype-interaction
      file: "08-prototype-interaction.html"
      function: "N linked screens at interaction fidelity"
      when: "reference only"
      interaction: "decorative"
      avoid: "decorative -- do not place in a CAS deliverable"
    - id: slide-deck
      file: "09-slide-deck.html"
      function: "presentation as one HTML file, arrow-key nav, no build"
      when: "Case#2 engagement pitch needs a navigable deck (sec 8.3)"
      interaction: "functional (keyboard nav)"
    - id: svg-illustrations
      file: "10-svg-illustrations.html"
      function: "inline SVG diagrams, individually tweakable/copyable"
      when: "a concept needs an inline tweakable diagram (any case)"
      interaction: none
    - id: status-report
      file: "11-status-report.html"
      function: "shipped/slipped summary + small chart, skim-formatted"
      when: "summary judgment + metrics for a quick skim (sec 1)"
      interaction: none
    - id: incident-report
      file: "12-incident-report.html"
      function: "post-mortem: minute-by-minute timeline, log excerpts, checklist"
      when: "Case#3 reproducibility / audit chain (sec 6) -- top match for timelines"
      interaction: none
    - id: flowchart-diagram
      file: "13-flowchart-diagram.html"
      function: "pipeline flowchart, click a step for timings/failure paths"
      when: "architecture narrative -- what fails closed (sec 3.3)"
      interaction: "functional (click-to-expand steps)"
    - id: research-feature-explainer
      file: "14-research-feature-explainer.html"
      function: "TL;DR box, collapsible steps, tabbed snippets, FAQ"
      when: "explaining a feature; source of reusable collapsible + tabs primitives"
      interaction: "functional (collapsible, tabs)"
    - id: research-concept-explainer
      file: "15-research-concept-explainer.html"
      function: "interactive ring viz + comparison table + glossary"
      when: "a concept needs a comparison table or interactive explainer"
      interaction: "functional (interactive viz add/remove)"
    - id: implementation-plan
      file: "16-implementation-plan.html"
      function: "timeline w/ milestones, data-flow, risk assessment table"
      when: "Case#2 governance/risk presentation (sec 8.8)"
      interaction: none
    - id: pr-writeup
      file: "17-pr-writeup.html"
      function: "author's side: motivation, before/after, file-by-file with why"
      when: "Case#1 claim-to-code narrative (sec 2)"
      interaction: none
    - id: editor-triage-board
      file: "18-editor-triage-board.html"
      function: "drag tickets across Now/Next/Later/Cut, export as markdown"
      when: "never in deliverables"
      interaction: "functional (drag-drop)"
      avoid: "editing tool, not read-only evidence -- out of scope for CAS reports"
    - id: editor-feature-flags
      file: "19-editor-feature-flags.html"
      function: "grouped toggles, dependency warnings, copy-diff button"
      when: "never in deliverables"
      interaction: "functional (toggles)"
      avoid: "editing tool -- out of scope for CAS reports"
    - id: editor-prompt-tuner
      file: "20-editor-prompt-tuner.html"
      function: "editable template w/ variable slots, live re-render"
      when: "never in deliverables"
      interaction: "functional (live edit)"
      avoid: "editing tool -- out of scope for CAS reports"
