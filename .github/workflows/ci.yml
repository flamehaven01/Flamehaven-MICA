name: CI

on:
  # Every branch, not just main. Required status checks are evaluated against a
  # commit SHA, so a SHA has to carry passing checks *before* it can land on a
  # protected main. With CI running only on main that is circular: the push
  # that would trigger the checks is the push the checks would gate.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check tools/ tests/

      - name: Format check (ruff)
        run: ruff format --check tools/ tests/

      - name: Run PCT fixture tests
        run: pytest -v

  # Generic linting says the Python is well formed. These say MICA still tells
  # every package the same thing it told them before this commit, and that the
  # project meets the demands it makes of its consumers.
  memory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Golden check output is unchanged
        run: pytest tests/test_golden_pct.py -v

      - name: Project meets its own consistency rules
        run: pytest tests/test_repo_self_consistency.py -v

      - name: README examples produce the output they claim
        run: pytest tests/test_readme_examples.py -v

      # Negative fixtures exist on purpose, so this cannot require exit 0 from
      # every package. It requires the tool to run without crashing, which the
      # previous `|| true` also swallowed: a traceback and a clean INCOMPLETE
      # were indistinguishable to it.
      - name: Every fixture runs the validator without crashing
        run: |
          set -e
          for pkg in fixtures/*/; do
            if [ -f "$pkg/mica.yaml" ] || [ -f "$pkg/memory/mica.yaml" ]; then
              status=0
              output="$(python tools/mica_pct.py "$pkg" 2>&1)" || status=$?
              if [ "$status" -gt 1 ] || grep -q "Traceback" <<< "$output"; then
                echo "::error::$pkg crashed the validator"
                printf '%s\n' "$output"
                exit 1
              fi
            fi
          done

      - name: Context budget is reported, not silently drifting
        run: python tools/mica_measure.py fixtures/memory_profiles
