mica_spec: 0.2.9
name: memory_first_minimal
mode: memory_first
memory_policy:
  primary_store: memory/
  session_capture: true
  observation_append_only: true
  memory_exports_required: true
  slot_projection_enabled: true
  graph_projection_enabled: true
flow_policy:
  enabled: false
  required: false
invocation_protocol:
  primary_pattern: explicit
  agent_context_surfaces:
    - archive
    - playbook
    - slots
  operator_only_surfaces:
    - memories
    - recall
layers:
  - id: sessions
    kind: sessions
    path: memory/mica.sessions.jsonl
    loading_hint: on_demand
  - id: observe
    kind: observations
    path: memory/mica.observe.jsonl
    loading_hint: always
  - id: memories
    kind: memories
    path: memory/mica.memories.jsonl
    loading_hint: on_demand
  - id: recall
    kind: recall
    path: memory/mica.recall.jsonl
    loading_hint: on_demand
  - id: slots
    kind: slots
    path: memory/mica.slots.json
    loading_hint: always
  - id: graph
    kind: graph
    path: memory/mica.graph.jsonl
    loading_hint: on_demand
  - id: archive_export
    kind: archive
    path: memory/mica_archive.json
    loading_hint: always
  - id: playbook_export
    kind: playbook
    path: memory/mica_playbook.md
    loading_hint: always

