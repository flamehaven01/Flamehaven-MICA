mica_spec: "0.2.5"
name: hook-output-test
mode: memory_injection
description: "Fixture: hook_output with violations_only filter and max_di_lines cap."

layers:
  - name: archive
    path: memory/test.mica.v1.0.0.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/test-playbook.v1.0.0.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol
  hook_output:
    max_di_lines: 2
    di_filter: violations_only

update_triggers:
  - on_explicit_save
