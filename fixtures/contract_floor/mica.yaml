mica_spec: "0.2.4"
name: contract-floor
mode: memory_injection
description: "Fixture: the lowest fully supported contract version. Pins the floor of SUPPORTED_CONTRACT_VERSIONS end to end."

layers:
  - name: archive
    path: memory/mica_archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/mica_playbook.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
